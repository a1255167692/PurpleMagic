    }

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 构建脚本内部用 `flutter pub get --offline`，先联网拉一次灌进缓存
      - name: 准备 Flutter 依赖
        working-directory: launcher/Flutter
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      # 仓库不含美术图，用自带 webp 占位（能跑，不好看，之后可替换）
      - name: 写入 profile 与占位美术
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "runtime/launcher-input" -Force | Out-Null
          $env:PROFILE_JSON | Set-Content -Path "runtime/launcher-input/profile.json" -Encoding utf8NoBOM
          Get-Content "runtime/launcher-input/profile.json" -TotalCount 3

          $assets = "launcher/Flutter/assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          if (-not (Test-Path "$assets/background.webp"))   { Copy-Item "docs/images/launcher.webp" "$assets/background.webp" }
          if (-not (Test-Path "$assets/announcement.webp")) { Copy-Item "docs/images/benefits.webp" "$assets/announcement.webp" }
          Get-ChildItem $assets

      - name: 构建登录器
        shell: cmd
        run: BUILD_FLUTTER.bat --flutter "%FLUTTER_ROOT%" --dotnet dotnet --profile-dir runtime/launcher-input --output dist/PurpleMagic

      - name: 打包便携 EXE
        shell: cmd
        run: BUILD_PORTABLE.bat --bundle dist/PurpleMagic.zip --output dist/PurpleMagic.exe --dotnet dotnet

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PurpleMagic
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/PurpleMagic.exe
            dist/PurpleMagic.zip
